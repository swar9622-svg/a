    function renderReviewQuestion() {

><tbody>';if(!rows.length)h+='<tr><td colspan="9">لا يوجد طلاب في الوحدات المحددة</td></tr>';rows.forEach(function(r,ri){function cell(v,half){var n=Number(v)||0;return '<td class="'+(n<half?'weak-low':'')+'">'+weakEsc(n.toFixed(1).replace('.0',''))+'</td>';}h+='<tr><td class="weak-serial-cell">'+(ri+1)+'</td><th class="weak-name-cell">'+weakEsc(r.name)+'</th><td class="weak-section-cell">'+weakEsc(r.section||'')+'</td>'+cell(r.homework,5)+cell(r.activity,5)+cell(r.check,5)+cell(r.achievement,5)+cell(r.test,10)+cell(r.total,30)+'</tr>';});box.innerHTML=h+'</tbody></table></div>';if(refresh){refresh.disabled=false;refresh.textContent='تحديث التقرير';}}).withFailureHandler(function(e){box.innerHTML='<div style="color:#b91c1c">تعذر تحميل التقرير: '+weakEsc(e.message||e)+'</div>';if(refresh){refresh.disabled=false;refresh.textContent='تحديث التقرير';}});(forceRefresh?runner.getWeakStudentsReport:runner.getWeakStudentsReportCached)(cls.value,sec.value,units,teacherSessionToken);};
