<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#112b39">
<title>مربّع الوتر — لعبة برهان فيثاغورس</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap');
:root{--night:#102633;--panel:#183847;--cream:#fff3d5;--gold:#f3c76d;--mint:#82d2bb;--tile:48px}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:'Cairo',sans-serif;background:radial-gradient(ellipse at 48% -18%,#396773 0,#224858 36%,#142f3c 76%,#102633 100%);overflow-x:hidden}body:before{content:"";pointer-events:none;position:fixed;inset:0;opacity:.14;background-image:radial-gradient(#f6e4b5 .7px,transparent .8px);background-size:17px 17px}.app{max-width:1180px;margin:auto;padding:20px 22px 30px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:49px;height:49px;border:1px solid #f5d18b88;border-radius:16px;background:linear-gradient(145deg,#ffffff16,#ffffff03);display:grid;place-items:center;color:#ffd98e;font-size:25px;box-shadow:inset 0 1px #fff3,0 6px 20px #081b2540}.brand h1{font:700 35px/1.1 'Amiri',serif;color:#ffe1a5;margin:0}.brand p{font-size:12px;margin:3px 0 0;color:#bfd3d2}.audio{font:600 12px 'Cairo',sans-serif;color:#f9ebc9;background:#ffffff0d;border:1px solid #ffffff2b;border-radius:12px;padding:9px 12px;cursor:pointer}.levels{display:flex;align-items:center;gap:9px;margin:11px 0 13px}.levels span{font-size:12px;color:#d1dfd8;white-space:nowrap}.level{font:700 13px 'Cairo',sans-serif;color:#deebe3;background:#ffffff0b;border:1px solid #ffffff25;border-radius:12px;padding:8px 18px;cursor:pointer;transition:.2s}.level:hover{transform:translateY(-1px)}.level.on{background:linear-gradient(135deg,#ffe2a2,#efb552);color:#233c3e;border-color:#ffe6b1;box-shadow:0 5px 17px #eba94635}.game{position:relative;background:linear-gradient(145deg,#fff6db12,#081c251c),radial-gradient(ellipse at 52% 45%,#285464,#1c4050 75%);border:1px solid #f6d89465;border-radius:24px;box-shadow:0 24px 65px #06182166,inset 0 1px #fff2;padding:18px 20px 14px;overflow:hidden}.game:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(174deg,transparent 0 31px,#fff 32px,#fff 33px,transparent 34px);opacity:.018}.above{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 8px 3px}.instruction{font-size:13px;color:#e0e9dd}.instruction b{color:#ffdc92}.status{font-size:12px;color:#bdd7cf;text-align:left;min-height:20px}svg#scene{display:block;position:relative;z-index:1;width:100%;height:auto;max-height:calc(100vh - 205px);min-height:390px;touch-action:none;overflow:visible}.wood-square{stroke:#ffe2a1;stroke-width:2.2;filter:url(#shadow)}.outline{fill:none;stroke:#ffe6af;stroke-width:2.5;stroke-linejoin:round}.triangle{fill:url(#triFill);stroke:#fff2c9;stroke-width:3;filter:url(#shadow)}.right-angle{fill:none;stroke:#fff4cd;stroke-width:3}.target-bg{fill:#0d2936aa;stroke:#ffe4a2;stroke-width:3;stroke-linejoin:round;filter:url(#shadow)}.slot{fill:#f4dfa508;stroke:#f5dfaa88;stroke-width:1.2;stroke-dasharray:4 4;transition:.16s}.slot.used{fill:#85d5be27;stroke:#d6f0cb55;stroke-dasharray:none}.slot.over{fill:#ffe4a27a;stroke:#fff1c7;stroke-width:2}.hide-grid .slot:not(.used){stroke:transparent;fill:transparent}.piece{cursor:grab;touch-action:none;filter:url(#pieceShadow);transition:filter .13s}.piece:active{cursor:grabbing}.piece rect{stroke:#fff3d17d;stroke-width:1.4;rx:3}.piece .grain{stroke:#fff8dc44;stroke-width:1.1;fill:none;pointer-events:none}.piece.selected{filter:url(#pieceGlow)}.piece.selected rect{stroke:#fff1a9;stroke-width:2.5}.square-caption{font:700 17px 'Cairo',sans-serif;fill:#fff0c9;text-anchor:middle}.side-label{font:700 17px 'Amiri',serif;fill:#fff4d6;text-anchor:middle}.target-caption{font:700 18px 'Cairo',sans-serif;fill:#ffdfa0;text-anchor:middle}.tray-frame{fill:#081f2c63;stroke:#ffe3a360;stroke-width:2;stroke-dasharray:7 5;rx:15}.controls{display:flex;justify-content:center;gap:8px;margin:-1px auto 2px;position:relative;z-index:2}.ctrl{font:600 12px 'Cairo',sans-serif;color:#fff1d2;background:#ffffff0e;border:1px solid #f5d8987a;border-radius:10px;padding:7px 13px;cursor:pointer;transition:.18s}.ctrl:hover:not(:disabled){background:#ffd88b35;transform:translateY(-1px)}.ctrl:disabled{opacity:.42;cursor:not-allowed}.bottom{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:7px 7px 0;color:#d8e4d9;font-size:11px}.progress{display:flex;align-items:center;gap:9px}.bar{width:118px;height:7px;border-radius:9px;background:#ffffff20;overflow:hidden}.bar i{height:100%;display:block;width:0;background:linear-gradient(90deg,#78d8bd,#ffe29c);border-radius:inherit;transition:width .3s}.reset{font:600 12px 'Cairo',sans-serif;color:#f3d695;border:0;background:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.win{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#0e2836eF;backdrop-filter:blur(7px);border-radius:inherit;text-align:center;padding:20px}.win.show{display:flex}.winbox{animation:pop .42s both;max-width:460px}.win .star{font-size:50px;color:#ffe19b}.win h2{font:700 39px 'Amiri',serif;color:#ffe2a3;margin:1px 0}.win p{color:#e4ede3;line-height:1.9;margin:2px 0 18px}.win button{font:700 13px 'Cairo',sans-serif;color:#21383a;background:linear-gradient(135deg,#ffe2a1,#edb451);border:0;border-radius:12px;padding:9px 18px;cursor:pointer}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:700px){.app{padding:13px 9px 20px}.brand h1{font-size:29px}.brand p{font-size:10px}.logo{width:42px;height:42px}.game{padding:13px 9px 12px;border-radius:18px}.above{flex-direction:column;align-items:flex-start;gap:0;margin-bottom:0}.status{text-align:right}.levels{gap:6px}.level{padding:8px 12px;font-size:12px}svg#scene{min-height:320px;max-height:none}.bottom{margin-inline:3px}.bar{width:75px}}@media(max-width:390px){.app{padding-inline:6px}.game{padding-inline:4px}.level{padding:7px 9px}.audio{padding:8px}.brand{gap:8px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">△</div><div><h1>مربّع الوتر</h1><p>اكتشف البرهان بيديك، قطعةً بعد قطعة</p></div></div><button class="audio" id="audio">♪ الصوت يعمل</button></header>
<nav class="levels" aria-label="المراحل"><span>المراحل:</span><button class="level on" data-l="0">سهلة</button><button class="level" data-l="1">صعبة</button><button class="level" data-l="2">أصعب</button></nav>
<main class="game"><div class="above"><div class="instruction"><b>اسحب القطع من مربعي الساق</b> واملأ بها مربع الوتر الفارغ.</div><div class="status" id="status" aria-live="polite">حرّك قطعة خشبية إلى خانة مضيئة في مربع الوتر.</div></div>
<svg id="scene" viewBox="0 0 1000 660" role="application" aria-label="مثلث قائم ومربعات على أضلاعه؛ انقل قطع مربعي الساق إلى مربع الوتر">
<defs><linearGradient id="woodA" x2="1" y2="1"><stop stop-color="#ffd489"/><stop offset=".48" stop-color="#e99e54"/><stop offset="1" stop-color="#b8613c"/></linearGradient><linearGradient id="woodB" x2=".9" y2="1"><stop stop-color="#ffe08f"/><stop offset=".52" stop-color="#edb951"/><stop offset="1" stop-color="#c87c39"/></linearGradient><linearGradient id="triFill" x2="1" y2="1"><stop stop-color="#68c9bd" stop-opacity=".88"/><stop offset="1" stop-color="#30968f" stop-opacity=".72"/></linearGradient><linearGradient id="pieceA" x2=".8" y2="1"><stop stop-color="#ffd28a"/><stop offset=".55" stop-color="#e89951"/><stop offset="1" stop-color="#bf693e"/></linearGradient><linearGradient id="pieceB" x2="1" y2="1"><stop stop-color="#ffdc83"/><stop offset=".55" stop-color="#e6a34d"/><stop offset="1" stop-color="#b97536"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#071923" flood-opacity=".45"/></filter><filter id="pieceShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#101d22" flood-opacity=".55"/></filter><filter id="pieceGlow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffe99a" flood-opacity=".9"/></filter></defs>
<!-- المربع المبني على الضلع العمودي -->
<rect class="wood-square" x="226" y="261" width="144" height="144" rx="3" fill="url(#woodA)"/>
<!-- المربع المبني على الضلع الأفقي -->
<rect class="wood-square" x="370" y="405" width="192" height="192" rx="3" fill="url(#woodB)"/>
<!-- المثلث القائم -->
<path class="triangle" d="M370 405 L370 261 L562 405 Z"/>
<path class="right-angle" d="M370 381 L394 381 L394 405"/>
<!-- مربع الوتر: مربع مائل على الضلع المائل -->
<path class="target-bg" d="M370 261 L514 69 L706 213 L562 405 Z"/>
<!-- عناوين الشكل -->
<text class="square-caption" x="296" y="248">مربع الساق</text><text class="square-caption" x="468" y="624">مربع الساق</text><text class="target-caption" x="552" y="58">مربع الوتر</text>
<text class="side-label" x="348" y="338">أ</text><text class="side-label" x="466" y="430">ب</text><text class="side-label" x="500" y="250">ج</text>
<!-- خانات المربع المائل -->
<g id="slots"></g><g id="pieces"></g>
<g id="trayA"></g><g id="trayB"></g>
<g id="trayLabels" pointer-events="none"><text class="square-caption" x="164" y="293">قطع الساق</text><text class="square-caption" x="654" y="545">قطع الساق</text></g>
</svg>
<div class="controls"><button class="ctrl" id="turn" disabled>⟳ تدوير</button><button class="ctrl" id="mirror" disabled>↔ قلب</button></div>
<div class="bottom"><div class="progress"><span id="progText">كل قطعة تقرّبك من الاكتمال</span><div class="bar"><i id="fill"></i></div></div><button class="reset" id="reset">إعادة المرحلة</button></div>
<div class="win" id="win"><div class="winbox"><div class="star">✦</div><h2>رائع! اكتمل المربع</h2><p>نقلت القطع من مربعي الساق، واجتمعت داخل مربع الوتر. لقد رأيت البرهان يتشكّل أمامك.</p><button id="next">المرحلة التالية</button></div></div>
</main></div>
<script>
(()=>{
const svg=document.querySelector('#scene'), slotsG=document.querySelector('#slots'),piecesG=document.querySelector('#pieces'),trayA=document.querySelector('#trayA'),trayB=document.querySelector('#trayB');const status=document.querySelector('#status'),fill=document.querySelector('#fill'),progText=document.querySelector('#progText'),turn=document.querySelector('#turn'),mirror=document.querySelector('#mirror'),win=document.querySelector('#win');const ns='http://www.w3.org/2000/svg';const side=48,angle=Math.atan2(-192,144)*180/Math.PI;let level=0,selected=null,drag=null,placed=0,sound=true,audioCtx=null;
const slots=[];
function el(name,attrs={}){let n=document.createElementNS(ns,name);for(let k in attrs)n.setAttribute(k,attrs[k]);return n}
function point(x,y){let p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(svg.getScreenCTM().inverse())}
function ping(f=480,d=.08){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function cellPos(i,j){return{x:370+i*28.8+j*38.4,y:261-i*38.4+j*28.8}}
function buildSlots(){slotsG.replaceChildren();slots.length=0;for(let i=0;i<5;i++)for(let j=0;j<5;j++){let p=cellPos(i,j),poly=el('polygon',{class:'slot',points:`${p.x},${p.y} ${p.x+28.8},${p.y-38.4} ${p.x+67.2},${p.y-9.6} ${p.x+38.4},${p.y+28.8}`,'data-i':i,'data-j':j});slotsG.append(poly);slots.push({i,j,el:poly,center:{x:p.x+33.6,y:p.y-4.8},piece:null})}}
function makePiece(kind,n){let g=el('g',{class:'piece','data-kind':kind,'data-id':kind+n,tabindex:'0',role:'button','aria-label':'قطعة من مربع الساق'});g.dataset.rot='0';g.dataset.flip='1';let rect=el('rect',{x:0,y:0,width:side,height:side,fill:kind==='a'?'url(#pieceA)':'url(#pieceB)'});g.append(rect);let line1=el('path',{class:'grain',d:'M8 8 Q22 13 40 8 M7 20 Q23 26 41 19 M7 34 Q22 28 41 35'});g.append(line1);let shine=el('path',{d:'M4 4 L4 44',stroke:'#fff8d655','stroke-width':'2'});g.append(shine);g.dataset.angle='0';return g}
function setT(g,x,y,rotation=0,flip=1){g.setAttribute('transform',`translate(${x} ${y}) rotate(${rotation} 24 24) scale(${flip} 1)`) }
function reset(){placed=0;selected=null;drag=null;slots.forEach(s=>s.piece=null);piecesG.replaceChildren();trayA.replaceChildren();trayB.replaceChildren();buildSlots();document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('hidden',false));win.classList.remove('show');turn.disabled=mirror.disabled=true;let aa=[],bb=[];for(let i=0;i<9;i++)aa.push(makePiece('a',i));for(let i=0;i<16;i++)bb.push(makePiece('b',i));if(level>0){aa.sort(()=>Math.random()-.5);bb.sort(()=>Math.random()-.5)}
// مربّع الساق الأيسر: ثلاث خانات في كل اتجاه، بجوار الضلع القائم
for(let k=0;k<aa.length;k++){let i=k%3,j=Math.floor(k/3),g=aa[k];setT(g,226+i*48,261+j*48);trayA.append(g)}
// مربّع الساق السفلي: أربع خانات في كل اتجاه
for(let k=0;k<bb.length;k++){let i=k%4,j=Math.floor(k/4),g=bb[k];setT(g,370+i*48,405+j*48);trayB.append(g)}
if(level===2)svg.classList.add('hide-grid');else svg.classList.remove('hide-grid');update();status.textContent='حرّك قطعة خشبية إلى خانة مضيئة في مربع الوتر.'}
function choose(g){if(selected)selected.classList.remove('selected');selected=g;if(g){g.classList.add('selected');turn.disabled=mirror.disabled=false}else turn.disabled=mirror.disabled=true}
function update(){let pct=Math.round(placed/25*100);fill.style.width=pct+'%';progText.textContent=placed===0?'كل قطعة تقرّبك من الاكتمال':placed===25?'اكتمل مربع الوتر!':'القطع في طريقها إلى مكانها';if(placed===25){status.textContent='اكتمل الشكل بنجاح!';win.classList.add('show');ping(660,.18);setTimeout(()=>ping(850,.24),170)}}
function nearest(x,y){let best=null,dmin=1e9;slots.forEach(s=>{if(s.piece)return;let d=Math.hypot(s.center.x-x,s.center.y-y);if(d<dmin){best=s;dmin=d}});return dmin<39?best:null}
function moveToSlot(g,s){if(!g||!s||s.piece)return false;let p=cellPos(s.i,s.j);setT(g,p.x,p.y,angle,+g.dataset.flip);g.dataset.rot=angle;s.piece=g;s.el.classList.add('used');g.classList.remove('selected');piecesG.append(g);g.dataset.slot=`${s.i},${s.j}`;g.style.cursor='grab';placed++;choose(null);ping(510,.07);update();return true}
function pointerDown(e){let g=e.target.closest('.piece');if(!g)return;e.preventDefault();choose(g);let q=point(e.clientX,e.clientY);drag={g,dx:q.x,dy:q.y,start:g.getAttribute('transform'),moved:false,source:g.parentNode};g.setPointerCapture?.(e.pointerId)}
function pointerMove(e){if(!drag)return;let q=point(e.clientX,e.clientY);if(Math.hypot(q.x-drag.dx,q.y-drag.dy)>3)drag.moved=true;if(drag.moved){setT(drag.g,q.x-24,q.y-24,0,+drag.g.dataset.flip);slots.forEach(s=>s.el.classList.toggle('over',!s.piece&&Math.hypot(s.center.x-q.x,s.center.y-q.y)<39))}}
function pointerUp(e){if(!drag)return;let d=drag;drag=null;slots.forEach(s=>s.el.classList.remove('over'));let q=point(e.clientX,e.clientY),slot=nearest(q.x,q.y);if(slot&&moveToSlot(d.g,slot))return;if(!d.moved){if(d.g.parentNode===piecesG){let s=slots.find(x=>x.piece===d.g);if(s){s.piece=null;s.el.classList.remove('used');piecesG.removeChild(d.g);(d.g.dataset.kind==='a'?trayA:trayB).append(d.g);placed--;update();status.textContent='أعد القطعة إلى مربعها أو اختر خانة جديدة.'}}return}if(d.g.parentNode!==piecesG){d.g.setAttribute('transform',d.start);status.textContent='ضع القطعة على مربع الوتر لإكمال الصورة.'}else{let s=slots.find(x=>x.piece===d.g);if(s)setT(d.g,cellPos(s.i,s.j).x,cellPos(s.i,s.j).y,angle,+d.g.dataset.flip)}}
svg.addEventListener('pointerdown',pointerDown);svg.addEventListener('pointermove',pointerMove);svg.addEventListener('pointerup',pointerUp);svg.addEventListener('pointercancel',pointerUp);
slotsG.addEventListener('click',e=>{let s=slots.find(x=>x.el===e.target);if(s&&selected)moveToSlot(selected,s)});
turn.addEventListener('click',()=>{if(!selected)return;let deg=(+selected.dataset.rot+90)%360;selected.dataset.rot=deg;let tr=selected.getAttribute('transform')||'';selected.setAttribute('transform',tr.replace(/rotate\([^)]*\)/,`rotate(${deg} 24 24)`));ping(390,.06)});
mirror.addEventListener('click',()=>{if(!selected)return;let f=selected.dataset.flip==='1'?-1:1;selected.dataset.flip=f;let tr=selected.getAttribute('transform')||'';tr=tr.replace(/scale\([^)]*\)/,'').trim()+` scale(${f} 1)`;selected.setAttribute('transform',tr);ping(350,.06)});
document.querySelector('#reset').addEventListener('click',reset);document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{level=+b.dataset.l;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('on',x===b));reset()}));document.querySelector('#next').addEventListener('click',()=>{level=(level+1)%3;document.querySelectorAll('.level').forEach(b=>b.classList.toggle('on',+b.dataset.l===level));reset()});document.querySelector('#audio').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'♪ الصوت يعمل':'♪ الصوت متوقف';if(sound)ping()});
buildSlots();reset();
})();
</script></body></html>
